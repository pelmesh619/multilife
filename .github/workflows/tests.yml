name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libboost-dev

      - name: Configure
        run: cmake -S server -B build/server -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/server

      - name: Run tests
        run: ctest --test-dir build/server --output-on-failure --timeout 60

  client:
    name: Client tests
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S client -B build/client -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/client

      - name: Run tests
        run: ctest --test-dir build/client --output-on-failure --timeout 60
